<svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190" role="img" aria-labelledby="title desc">
  <title id="title">Suhan Ramani engineering map</title>
  <desc id="desc">A minimalist diagram connecting AI systems, product engineering, distributed systems and core systems.</desc>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  <rect width="900" height="190" rx="16" fill="#0b0f14"/>
  <rect x="1" y="1" width="898" height="188" rx="15" fill="none" stroke="#263241"/>

  <g stroke="url(#line)" stroke-width="2" fill="none" opacity=".8">
    <path d="M205 95 H345"/>
    <path d="M555 95 H695"/>
    <path d="M450 54 V95"/>
    <path d="M450 95 V136"/>
  </g>

  <g fill="#60a5fa">
    <circle cx="205" cy="95" r="4"/>
    <circle cx="345" cy="95" r="4"/>
    <circle cx="450" cy="54" r="4"/>
    <circle cx="450" cy="136" r="4"/>
    <circle cx="555" cy="95" r="4"/>
    <circle cx="695" cy="95" r="4"/>
  </g>

  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="72" y="78" font-size="13" font-weight="700" fill="#f8fafc">AI SYSTEMS</text>
    <text x="72" y="101" font-size="11" fill="#64748b">ML · MCP · inference</text>

    <text x="373" y="87" font-size="13" font-weight="700" fill="#f8fafc">ENGINEERING</text>
    <text x="381" y="107" font-size="11" fill="#64748b">the bridge</text>

    <text x="706" y="78" font-size="13" font-weight="700" fill="#f8fafc">DISTRIBUTED</text>
    <text x="706" y="101" font-size="11" fill="#64748b">consensus · fault tolerance</text>

    <text x="362" y="31" font-size="11" fill="#64748b">PRODUCT</text>
    <text x="362" y="159" font-size="11" fill="#64748b">CORE SYSTEMS</text>
  </g>
</svg>
