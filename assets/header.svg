<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">Suhan Ramani — Software Engineer</title>
  <desc id="d">Suhan Ramani, software engineer and CS undergraduate at IIT Jodhpur, building backend systems, distributed systems and AI infrastructure.</desc>
  <style>
    .bg     { fill: #ffffff; }
    .frame  { fill: none; stroke: #d0d7de; }
    .name   { fill: #0f172a; }
    .role   { fill: #475569; }
    .meta   { fill: #64748b; }
    .rule   { fill: #e2e8f0; }
    .accent { fill: #2563eb; }
    .edge   { stroke: #cbd5e1; }
    .live   { stroke: #2563eb; }
    .node   { fill: #ffffff; stroke: #94a3b8; }
    .nodeOn { fill: #2563eb; }
    .lbl    { fill: #64748b; }
    @media (prefers-color-scheme: dark) {
      .bg     { fill: #0d1117; }
      .frame  { stroke: #30363d; }
      .name   { fill: #f0f6fc; }
      .role   { fill: #9da7b3; }
      .meta   { fill: #7d8590; }
      .rule   { fill: #21262d; }
      .accent { fill: #58a6ff; }
      .edge   { stroke: #30363d; }
      .live   { stroke: #58a6ff; }
      .node   { fill: #0d1117; stroke: #6e7681; }
      .nodeOn { fill: #58a6ff; }
      .lbl    { fill: #7d8590; }
    }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .flow { stroke-dasharray: 6 10; animation: flow 2.4s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -32; } }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
  </style>

  <rect class="bg" width="1200" height="300" rx="12"/>
  <rect class="frame" x="0.5" y="0.5" width="1199" height="299" rx="11.5"/>

  <!-- left: identity -->
  <rect class="accent" x="64" y="70" width="28" height="3" rx="1.5"/>
  <text class="mono meta" x="64" y="56" font-size="13" letter-spacing="1.5">SOFTWARE ENGINEER</text>
  <text class="sans name" x="62" y="132" font-size="54" font-weight="700" letter-spacing="-1.2">Suhan Ramani</text>
  <text class="sans role" x="64" y="172" font-size="21">I build backend systems that stay fast once they get big.</text>

  <rect class="rule" x="64" y="208" width="560" height="1"/>
  <text class="mono meta" x="64" y="240" font-size="13" letter-spacing="0.4">Distributed systems  ·  AI infrastructure  ·  Backend engineering</text>
  <text class="mono meta" x="64" y="264" font-size="13" letter-spacing="0.4">CS @ IIT Jodhpur  ·  Bengaluru, India  ·  elarx.dev</text>

  <!-- right: a small replicated system -->
  <g fill="none" stroke-width="1.5">
    <path class="edge" d="M800 150 L940 80"/>
    <path class="edge" d="M800 150 L940 150"/>
    <path class="edge" d="M800 150 L940 220"/>
    <path class="edge" d="M940 80 L1080 150"/>
    <path class="edge" d="M940 150 L1080 150"/>
    <path class="edge" d="M940 220 L1080 150"/>
    <path class="edge" d="M940 80 L940 220"/>
    <path class="live flow" d="M800 150 L940 80 L1080 150"/>
    <path class="live flow" d="M800 150 L940 220 L1080 150"/>
  </g>
  <g stroke-width="1.5">
    <circle class="node" cx="940" cy="150" r="8"/>
    <circle class="node" cx="940" cy="80" r="8"/>
    <circle class="node" cx="940" cy="220" r="8"/>
    <circle class="nodeOn" cx="800" cy="150" r="9"/>
    <circle class="nodeOn" cx="1080" cy="150" r="9"/>
  </g>
  <g class="mono lbl" font-size="11" letter-spacing="0.8">
    <text x="768" y="182">request</text>
    <text x="912" y="60">replica-a</text>
    <text x="954" y="140">replica-b</text>
    <text x="912" y="250">replica-c</text>
    <text x="1052" y="182">commit</text>
  </g>
</svg>
