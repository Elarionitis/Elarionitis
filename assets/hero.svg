  <text x="58" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="20" fill="#94a3b8">Builds software from the model down to the machine.</text>

  <rect x="56" y="192" width="520" height="34" rx="8" fill="#0f172a" stroke="#1e293b"/>
  <text x="70" y="214" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#475569">$</text>
  <text x="88" y="214" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#cbd5e1">exploring --in</text>
  <g opacity="1"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.2499;0.2500;1" dur="12.0s" repeatCount="indefinite" calcMode="discrete"/>
      <clipPath id="c0"><rect x="232" y="196" height="26" width="0"><animate attributeName="width" values="0;158;158" keyTimes="0;0.45;1" dur="3.0s" begin="0.0s" repeatCount="indefinite"/></rect></clipPath>
      <text x="232" y="214" clip-path="url(#c0)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#60a5fa">AI / LLM tooling</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2500;0.2501;0.4999;0.5000;1" dur="12.0s" repeatCount="indefinite" calcMode="discrete"/>
      <clipPath id="c1"><rect x="232" y="196" height="26" width="0"><animate attributeName="width" values="0;167;167" keyTimes="0;0.45;1" dur="3.0s" begin="3.0s" repeatCount="indefinite"/></rect></clipPath>
      <text x="232" y="214" clip-path="url(#c1)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#60a5fa">operating systems</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5000;0.5001;0.7499;0.7500;1" dur="12.0s" repeatCount="indefinite" calcMode="discrete"/>
      <clipPath id="c2"><rect x="232" y="196" height="26" width="0"><animate attributeName="width" values="0;186;186" keyTimes="0;0.45;1" dur="3.0s" begin="6.0s" repeatCount="indefinite"/></rect></clipPath>
      <text x="232" y="214" clip-path="url(#c2)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#60a5fa">distributed systems</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.7500;0.7501;0.9999;1.0000;1" dur="12.0s" repeatCount="indefinite" calcMode="discrete"/>
      <clipPath id="c3"><rect x="232" y="196" height="26" width="0"><animate attributeName="width" values="0;244;244" keyTimes="0;0.45;1" dur="3.0s" begin="9.0s" repeatCount="indefinite"/></rect></clipPath>
