<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">Suhan Ramani</title>
  <desc id="d">Suhan Ramani, computer science at IIT Jodhpur. Building AI tooling and systems software, exploring open source.</desc>
  <defs>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.5"><stop offset="0" stop-color="#2563eb" stop-opacity=".22"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1e293b"/></pattern>
