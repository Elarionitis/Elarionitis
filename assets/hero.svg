  <text x="58" y="276" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.2" fill="#64748b">CS @ IIT JODHPUR  ·  AI SYSTEMS  ·  CORE SYSTEMS  ·  OPEN SOURCE</text>

  <!-- system diagram: model -> runtime -> machine -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1">
    <g fill="none" stroke="#1e3a8a" stroke-width="1.5">
