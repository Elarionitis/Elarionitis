  </defs>
  <rect width="1200" height="320" rx="18" fill="#0b0f14"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)" opacity=".6"/>
  <rect width="1200" height="320" rx="18" fill="url(#glow)"/>
  <rect x=".5" y=".5" width="1199" height="319" rx="17.5" fill="none" stroke="#263241"/>

