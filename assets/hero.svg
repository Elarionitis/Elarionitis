      <circle r="4"><animateMotion dur="2.2s" begin=".3s" repeatCount="indefinite"><mpath href="#p4"/></animateMotion></circle>
      <circle r="4"><animateMotion dur="1.6s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle>
